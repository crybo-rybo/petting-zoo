openapi: 3.1.0
info:
  title: Petting Zoo API
  version: 0.1.0
  summary: Local-first model orchestration and chat API.
  description: |
    Contract for the Petting Zoo application server.
    Includes health, model lifecycle, chat (sync + SSE stream), and MCP connector operations.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
  - name: Models
  - name: Chat
  - name: MCP
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness and version health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: petting-zoo-server
                  version:
                    type: string
                    example: 0.1.0
                  timestamp:
                    type: string
                    format: date-time

  /api/models:
    get:
      tags: [Models]
      summary: List model candidates and currently active model
      operationId: listModels
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Model inventory
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [models, active_model_id]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelSummary'
                  active_model_id:
                    type: string
                    nullable: true
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/models/register:
    post:
      tags: [Models]
      summary: Register a local GGUF model path on the server host
      operationId: registerModel
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRegisterRequest'
      responses:
        '201':
          description: Model registered
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [model]
                properties:
                  model:
                    $ref: '#/components/schemas/ModelSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/models/select:
    post:
      tags: [Models]
      summary: Set active model used for chat requests
      operationId: selectModel
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSelectRequest'
      responses:
        '200':
          description: Active model updated
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [active_model]
                properties:
                  active_model:
                    $ref: '#/components/schemas/ModelSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/models/unload:
    post:
      tags: [Models]
      summary: Unload the active model
      operationId: unloadModel
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Active model unloaded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: unloaded
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/chat/complete:
    post:
      tags: [Chat]
      summary: Send a user message to the active model and wait for completion
      operationId: completeChat
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompleteRequest'
      responses:
        '200':
          description: Completion returned
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/chat/stream:
    post:
      tags: [Chat]
      summary: Stream completion tokens from the active model as SSE
      operationId: streamChat
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompleteRequest'
      responses:
        '200':
          description: SSE event stream
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream with `token`, `done`, and `error` events.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/chat/reset:
    post:
      tags: [Chat]
      summary: Clear conversation history for the active model
      operationId: resetChat
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: History cleared
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResetResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/chat/clear_memory:
    post:
      tags: [Chat]
      summary: Wipe memory database and reinitialize memory context
      operationId: clearMemory
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Memory cleared
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearMemoryResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/mcp/connectors:
    get:
      tags: [MCP]
      summary: List configured MCP connectors
      operationId: listMcpConnectors
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Connector inventory
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/McpConnector'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/mcp/connectors/{id}/connect:
    post:
      tags: [MCP]
      summary: Connect an MCP connector to the active model runtime
      operationId: connectMcpConnector
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MCP connector connected
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnectionStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/mcp/connectors/{id}/disconnect:
    post:
      tags: [MCP]
      summary: Disconnect an MCP connector
      operationId: disconnectMcpConnector
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MCP connector disconnected
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [status, server_id]
                properties:
                  status:
                    type: string
                    const: disconnected
                  server_id:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  parameters:
    XCorrelationId:
      in: header
      name: X-Correlation-Id
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional request correlation ID. Generated by server when absent.

  headers:
    XCorrelationId:
      description: Correlation ID for tracing request flow.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State conflict
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request payload exceeds configured limit
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many requests
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal service failure
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamError:
      description: Upstream runtime error
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, category, message, retryable, correlation_id]
          properties:
            code:
              type: string
              example: APP-VAL-001
            category:
              type: string
              enum: [validation, auth, not_found, conflict, rate_limit, timeout, upstream, internal, server_error]
            message:
              type: string
            retryable:
              type: boolean
            correlation_id:
              type: string
            details:
              type: object
              additionalProperties: true

    ModelSummary:
      type: object
      required: [id, display_name, path, status, context_size]
      properties:
        id:
          type: string
        display_name:
          type: string
        path:
          type: string
        status:
          type: string
          enum: [available, unavailable]
        context_size:
          type: integer
          minimum: 1
        file_size_bytes:
          type: integer
          minimum: 0

    ModelRegisterRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
        display_name:
          type: string

    ModelSelectRequest:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
          minLength: 1
        context_size:
          type: integer
          minimum: 1

    ChatCompleteRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 16000
          description: Maximum length is server-configurable.

    ChatUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    ChatMetrics:
      type: object
      required: [latency_ms, time_to_first_token_ms, tokens_per_second]
      properties:
        latency_ms:
          type: integer
          minimum: 0
        time_to_first_token_ms:
          type: integer
          minimum: 0
        tokens_per_second:
          type: number
          minimum: 0

    ChatCompleteResponse:
      type: object
      required: [text, usage, metrics]
      properties:
        text:
          type: string
        usage:
          $ref: '#/components/schemas/ChatUsage'
        metrics:
          $ref: '#/components/schemas/ChatMetrics'

    ChatResetResponse:
      type: object
      required: [status, model_id]
      properties:
        status:
          type: string
          const: cleared
        model_id:
          type: string

    ClearMemoryResponse:
      type: object
      required: [status, model_id]
      properties:
        status:
          type: string
          const: memory_wiped
        model_id:
          type: string

    McpConnector:
      type: object
      required: [id, command, args]
      properties:
        id:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string

    McpConnectionStatus:
      type: object
      required: [server_id, connected, discovered_tool_count]
      properties:
        server_id:
          type: string
        connected:
          type: boolean
        discovered_tool_count:
          type: integer
          minimum: 0
